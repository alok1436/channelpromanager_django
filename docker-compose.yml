services:
  db:
    image: postgres:17-alpine
    env_file: .env
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"], interval: 5s, timeout: 5s, retries: 10}
  redis:
    image: redis:7-alpine
    volumes: [redis_data:/data]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10}
  web:
    build: {context: ., dockerfile: docker/django/Dockerfile}
    env_file: .env
    volumes: ["./backend:/app"]
    ports: ["8000:8000"]
    depends_on: {db: {condition: service_healthy}, redis: {condition: service_healthy}}
  celery_worker:
    build: {context: ., dockerfile: docker/django/Dockerfile}
    command: celery -A config worker -l info
    env_file: .env
    volumes: ["./backend:/app"]
    depends_on: {db: {condition: service_healthy}, redis: {condition: service_healthy}}
  celery_beat:
    build: {context: ., dockerfile: docker/django/Dockerfile}
    command: celery -A config beat -l info --schedule /tmp/celerybeat-schedule
    env_file: .env
    volumes: ["./backend:/app"]
    depends_on: {db: {condition: service_healthy}, redis: {condition: service_healthy}}
volumes: {postgres_data: {}, redis_data: {}}
