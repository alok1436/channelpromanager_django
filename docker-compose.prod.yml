services:
  web:
    build: {context: ., dockerfile: docker/django/Dockerfile, args: {REQUIREMENTS_FILE: production.txt}}
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60
    environment: {DJANGO_SETTINGS_MODULE: config.settings.production}
    volumes: [static_data:/app/staticfiles, media_data:/app/media]
    ports: []
  celery_worker:
    environment: {DJANGO_SETTINGS_MODULE: config.settings.production}
  celery_beat:
    environment: {DJANGO_SETTINGS_MODULE: config.settings.production}
  nginx:
    image: nginx:1.27-alpine
    ports: ["80:80"]
    volumes: ["./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro", static_data:/static:ro, media_data:/media:ro]
    depends_on: [web]
volumes: {static_data: {}, media_data: {}}
